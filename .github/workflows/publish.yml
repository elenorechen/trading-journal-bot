name: 發布貼文（/publish、/skip）

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: publish-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publish:
    # 只有 repo 擁有者在草稿 issue 留言 /publish 或 /skip 才會動作
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'draft') &&
      github.event.comment.user.login == github.repository_owner &&
      (startsWith(github.event.comment.body, '/publish') || startsWith(github.event.comment.body, '/skip'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 發文
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          COMMENT: ${{ github.event.comment.body }}
        run: python -m bot command --issue ${{ github.event.issue.number }}
