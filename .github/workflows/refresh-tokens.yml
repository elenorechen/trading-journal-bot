name: 展延 IG / Threads 權杖

on:
  schedule:
    # 每週日 UTC 02:00（台灣 10:00）。權杖 60 天到期，每週展延一次很安全
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 展延並寫回 Secrets
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m bot refresh-tokens
